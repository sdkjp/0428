name: gitdaw
description: "Git GUI client with DAW metaphor for non-programmers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.2
  watcher: ^1.2.1
  http: ^1.6.0
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  window_manager: ^0.5.1
  file_picker: ^11.0.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.0.0
  process_run: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
